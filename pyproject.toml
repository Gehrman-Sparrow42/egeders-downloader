[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egeders-downloader"
version = "0.1.0"
description = "Local, account-isolated Ege Ders course-resource downloader"
requires-python = ">=3.10"
dependencies = ["playwright>=1.50,<2", "beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
egeders = "egeders_downloader.cli:main"

[tool.setuptools.packages.find]
include = ["egeders_downloader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

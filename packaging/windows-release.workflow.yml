name: Windows release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: python -m pip install -e ".[test]" pyinstaller==6.22.3
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Test
        run: python -m pytest -q
      - name: Build and check frozen application
        run: python scripts/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: EgeDersDownloader-Windows
          path: |
            dist/*.zip
            dist/*Setup*.exe
            dist/SHA256SUMS.txt
      - name: Publish tag release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME dist/*.zip dist/*Setup*.exe dist/SHA256SUMS.txt --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME dist/*.zip dist/*Setup*.exe dist/SHA256SUMS.txt --verify-tag --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
